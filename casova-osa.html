<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--s1:#131316;--s2:#1c1c21;--ln:#2c2c33;--fg:#fff;--m:#d0d0d8;--g:#3f8f5a;--r:#c0463f;--p:#8465b5;--o:#dc8a2e;--b:#5580b0;--ac:#8465b5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:300 17px/1.65 Jost,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.1;margin:0}
h2{font-size:clamp(2rem,5vw,3.2rem);margin:3rem 0 1rem}h3{font-size:1.5rem;margin-bottom:.3rem}b{font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 5vw;background:rgba(10,10,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font:700 1.6rem "Cormorant Garamond",serif;letter-spacing:.12em;color:#fff;text-decoration:none;cursor:pointer}.logo small{font:300 .7rem Jost;letter-spacing:.25em;display:block;margin-top:-4px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;padding:7px 13px;font-size:.92rem;letter-spacing:.06em;border-bottom:2px solid transparent;transition:.3s}
nav a:hover,nav a.on{border-color:var(--ac);background:var(--s2)}
main{max-width:1080px;margin:auto;padding:0 5vw}
.page{display:none}.page.show{display:block}
.hero{position:relative;min-height:84vh;display:flex;flex-direction:column;justify-content:center;margin:0 -5vw;padding:0 5vw;overflow:hidden}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5;z-index:-1;transform:scale(1.35);animation:zm 40s ease-in-out infinite alternate}
@keyframes zm{to{transform:scale(1.5) translate(-2%,2%)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bg) 5%,transparent 70%),linear-gradient(0deg,var(--bg),transparent 40%)}
.hero h1{font-size:clamp(3.4rem,13vw,9rem);letter-spacing:.04em}.hero p{max-width:540px;font-size:1.2rem}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;padding:12px 26px;font:600 .95rem Jost;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.3s;border-radius:2px}
.btn:hover{filter:brightness(1.2);transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:default;transform:none}.btn.g{background:var(--s2);border:1px solid var(--ln)}
.card,.glass{position:relative;padding:24px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 55%,rgba(255,255,255,.09));backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:3px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.6);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 12px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.55),0 0 0 1px var(--ac)}
.card:hover,.glass:hover{border-color:var(--ac)}
body{background:transparent}#scene{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.6;pointer-events:none}.z{animation:zz 22s ease-in-out infinite alternate}@keyframes zz{to{transform:scale(1.1)}}
.sky{display:none}.tl .ev{text-shadow:0 0 14px #000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
[data-a]{opacity:0;transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1),clip-path 1s}
[data-a=l]{transform:translateX(-70px)}[data-a=r]{transform:translateX(70px)}[data-a=d]{transform:translateY(-50px)}
[data-a=x]{transform:scale(.7)}
[data-a].in{opacity:1;transform:none}
.note{position:relative;min-height:92vh;display:flex;align-items:center;margin:0 -5vw;padding:40px 5vw;overflow:hidden;cursor:pointer}.note:nth-child(even){justify-content:flex-end}
.nb{position:absolute;inset:0;z-index:-1}.nb svg{width:100%;height:100%;animation:zn 26s ease-in-out infinite alternate}@keyframes zn{from{transform:scale(1)}to{transform:scale(1.14) translate(-1.5%,1.5%)}}
.nb::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,12,.7),transparent 60%)}.note:nth-child(even) .nb::after{background:linear-gradient(270deg,rgba(10,10,12,.7),transparent 60%)}
.tx{width:min(520px,100%)}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;border:1px solid currentColor;padding:2px 10px;margin-bottom:8px}
@media(max-width:700px){.note{display:block;min-height:0;padding:0 5vw 30px}.nb{position:relative;inset:auto;z-index:0}.nb svg{height:auto;animation:none}.nb::after{display:none}}
.tl{position:relative;padding:10px 0}.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ln)}
.ev{position:relative;width:50%;padding:0 34px 30px 0;text-align:right}.ev:nth-child(even){margin-left:50%;padding:0 0 30px 34px;text-align:left}
.ev::after{content:"";position:absolute;right:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--ac))}.ev:nth-child(even)::after{right:auto;left:-6px}
.ev b{font:700 1.8rem "Cormorant Garamond";color:var(--c,#fff)}
@media(max-width:700px){.tl::before{left:8px}.ev,.ev:nth-child(even){width:100%;margin:0;padding:0 0 26px 30px;text-align:left}.ev::after,.ev:nth-child(even)::after{left:2px;right:auto}}
.sky{width:100%;height:auto;margin:2rem 0;display:block}
.bar{height:8px;background:var(--s2);margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
.k{font:700 clamp(2.4rem,8vw,4.4rem) "Cormorant Garamond";text-align:center}
.up{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.up small{color:var(--m);display:block}
input{width:100%;padding:13px;margin:6px 0;background:var(--s2);border:1px solid var(--ln);color:#fff;font:inherit;border-radius:2px}input:focus{outline:2px solid var(--ac)}
